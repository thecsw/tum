# tum recipe for yaft.
#
# Source is the pinned rM2-stuff git submodule at apps/rM2-stuff (closed-room:
# tum owns the exact commit). The cross-armhf Docker image includes git-lfs so
# the Noto font is fetched (without it the build embeds a 131-byte LFS pointer
# as font data and yaft segfaults at startup).

name = "yaft"
display_name = "YAFT"
source_dir = "apps/rM2-stuff"                    # relative to tum repo root

# Cross-compile via Docker. {{.TumRoot}} is the tum repo root (mounted at /src),
# {{.SourceDir}} is the recipe's source_dir (apps/rM2-stuff). We cd into it
# because CMakePresets.json lives there.
build_cmd = 'docker run --rm -v "{{.TumRoot}}:/src:cached" -w /src/{{.SourceDir}} rm2stuff-cross-armhf bash -c "cmake -B build/cross-armhf --preset cross-armhf && cmake --build build/cross-armhf --target yaft"'

binary = "build/cross-armhf/apps/yaft/yaft"       # relative to source_dir
binary_name = "yaft"                               # becomes yaft-<suffix> on device
icon = ""                                          # reuses upstream vellum icon on-device

[manifest]
aspect_ratio = "original"
qtfb = true

[manifest.environment]
LD_PRELOAD = "/home/root/shims/qtfb-shim.so"
QTFB_SHIM_MODEL = "RM1"
QTFB_SHIM_RESPECT_APP_REFRESH_MODES = "true"      # honor yaft's DU/GC16 modes
QTFB_SHIM_RESPECT_FULL_REFRESH_REQUESTS = "true"  # honor yaft's full-screen clears
QTFB_SHIM_INPUT_PATH_NULL = "/dev/input/touchscreen0"
QTFB_SHIM_INITIAL_DISPLAY_MODE = "ANIMATE"
